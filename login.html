<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Book System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        nav {
            background: #243b55;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #4facfe;
        }

        .login-container {
            width: 400px;
            max-width: 90%;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4facfe;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #243b55;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">📚 E-Book Library</div>

    <div>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="catalog.html">Catalog</a>
        <a href="cart.html">Cart 🛒</a>
    </div>
</nav>

<div class="login-container">

    <h2>Login</h2>

    <form action="catalog.html">

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register here</a>
    </div>

</div>

</body>
</html>
